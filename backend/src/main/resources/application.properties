spring.application.name=IM_CC_REST
spring.profiles.active=local
server.port=8081
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.accept-single-value-as-array=true

# RabbitMQ (optional: disabled unless RABBITMQ_HOST is set; bug reports then go straight to the database)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s

# Discord OAuth2 (optional: Discord login is disabled while the client id is empty)
app.discord.client-id=${DISCORD_CLIENT_ID:}
app.discord.client-secret=${DISCORD_CLIENT_SECRET:}
app.discord.redirect-uri=${APP_BASE_URL:http://localhost:8081}/login/oauth2/code/discord
